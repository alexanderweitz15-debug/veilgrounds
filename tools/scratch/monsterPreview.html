<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Monster preview</title>
<style>body{margin:0;background:#55613f}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1280" height="760"></canvas>
<script type="module">
  // Scratch preview of the jungle monster sprites (Agent jungle overhaul). ?ids=a,b&rows=idle:SE:0,attack:E:1
  import { drawChampionFrame } from '/src/render/champions/index.ts';
  const q = new URLSearchParams(location.search);
  const ids = (q.get('ids') ?? 'dornenbock,glutwaechter,sumpfunke,mooswolf,hohlkaefer,schattenkrabbe,nebelschleicher').split(',');
  const rows = (q.get('rows') ?? 'idle:SE:0,attack:E:1,run:S:1').split(',').map((r) => r.split(':'));
  const ctx = document.getElementById('c').getContext('2d');
  const S = Math.min(250, Math.floor(1280 / ids.length));
  ctx.strokeStyle = '#000';
  rows.forEach(([anim, dir, fr], r) => ids.forEach((id, i) => {
    drawChampionFrame(ctx, id, anim, dir, Number(fr), i * S, r * S, S - 6, 256);
    ctx.strokeRect(i * S, r * S, S - 6, S - 6);
  }));
</script>
</body>
</html>
